
<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Loja SENAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Loja SENAI</h1>

    <nav>
        <a href="#todos" id="primeiro">Ver todos</a>

        <a href="#aliancas">Acessórios</a>

    </nav>

<main>
    <h2 id="todos">Produtos à venda</h2>

    <section class="produtos">

            <p>R$ 55,90</p>
            <button>Comprar</button>
        </div>

        <div class="produto" id="jaquetas">

            <p>R$ 89,90</p>
            <button>Comprar</button>
        </div>

        <div class="produto" id="aliancas">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSe2fXBUjd8cJGSACbW6bM5tiKu6RTitEHtmdMQ60Pf-g&s=10" alt="">

            <p>R$ 45,00</p>

        </div>

</main>

</body>
</html>
